name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null; sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Rename APK
        run: mkdir -p release && cp android/app/build/outputs/apk/debug/app-debug.apk release/network.apk
      - uses: actions/upload-artifact@v4
        with:
          name: network-apk
          path: release/network.apk
          retention-days: 90
